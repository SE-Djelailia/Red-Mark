<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for browsers that ignore SVG favicons. -->
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <!-- iOS home screen. Deliberately opaque with square corners: iOS
         applies its own rounding, and a transparent corner renders black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- iPad sizes. iOS picks the nearest match rather than scaling the
         180 down, which keeps the diagonals crisp on a home screen. -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#E10600" />
    <meta name="description" content="RedMark — Documentation intelligente de chantier" />
    <link rel="manifest" href="/manifest.json" />
    <title>RedMark</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
