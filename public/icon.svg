<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- RedMark app icon: white X on brand red.
       Geometry is identical to <Logo variant="app" /> in
       src/app/components/ui-kit/Logo.tsx — same polygons, same 0.72 inset,
       same 22% corner radius. Keep the three in sync if the mark changes. -->
  <rect width="100" height="100" rx="22" fill="#E10600"/>
  <g transform="translate(50,50) scale(0.72) translate(-50,-50)">
    <polygon points="79.03,96 96,79.03 20.97,4 4,20.97" fill="#FFFFFF"/>
    <polygon points="96,20.97 79.03,4 4,79.03 20.97,96" fill="#FFFFFF"/>
  </g>
</svg>
