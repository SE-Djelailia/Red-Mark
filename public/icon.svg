<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>RedMark</title>
  <!-- Red X on white — the one brand treatment, shared with the PWA icons,
       the social avatars and the email signature. Geometry is BAR_A/BAR_B
       from Logo.tsx, inset 20% so the mark never touches the edge. -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <polygon points="67.418,77.600 77.600,67.418 32.582,22.400 22.400,32.582" fill="#E10600"/>
  <polygon points="77.600,32.582 67.418,22.400 22.400,67.418 32.582,77.600" fill="#E10600"/>
</svg>
